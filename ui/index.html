    if(a==='view'){var r=state.history.find(function(x){return x.id===t.dataset.id;});if(r&&r.drunk){state.after=r;state.screen='after';render();}return;}
    if(a==='toggle'){var visible=state.visibility[t.dataset.id]===false;var visibilityResponse=await fetch('/proof-api/human/visibility/'+encodeURIComponent(t.dataset.id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({visible:visible})});if(visibilityResponse.ok){state.visibility[t.dataset.id]=visible;persist();render();}}
  });
 root.addEventListener('input',function(e){if(e.target.id==='drink-name'){state.drinkName=e.target.value;state.nameError=false;}if(e.target.id==='drink-finish'){state.finishText=e.target.value;if(state.finishText.length>80)state.sendError='留言超过 80 字，未提交';else if(state.sendError==='留言超过 80 字，未提交')state.sendError='';}});
  root.addEventListener('change',function(e){if(e.target.id==='effect-visible'){state.effectVisibleToMixer=e.target.checked;var label=e.target.parentElement.querySelector('.effect-toggle-label');if(label)label.textContent=e.target.checked?'\u8fd9\u676f\u6548\u679c\u5bf9\u6211\u53ef\u89c1':'\u8fd9\u676f\u6548\u679c\u5bf9\u6211\u4e0d\u53ef\u89c1';}});
  refreshAuth().then(render);
  // 兼容清理：旧版本把登记酒款写进过 localStorage.customDrinks。
  // 按引擎菜单的稳定 id 剔除，不按显示名字删。幂等。
  (function pruneRegisteredFromStorage(){
    var registeredIds={};
    engineMenu.forEach(function(c){registeredIds[c.id]=true;});
    var before=state.drinks.length;
    state.drinks=state.drinks.filter(function(d){return d.registered||!registeredIds[d.id];});
    if(state.drinks.length!==before)persist();
  })();

  fetch('/proof-api/human/menu').then(function(r){return r.ok?r.json():Promise.reject();}).then(function(data){var remote=data.drinks||[],ids=new Set(remote.map(function(d){return d.id;})),serverVisibility=data.visibility||{};Object.keys(state.visibility).forEach(function(id){if(state.visibility[id]===false&&serverVisibility[id]===undefined)fetch('/proof-api/human/visibility/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({visible:false})});});state.visibility=Object.assign({},state.visibility,serverVisibility);state.drinks=state.drinks.filter(function(d){return d.registered||d.category!=='custom'||ids.has(d.id);});remote.forEach(function(d){var cup=buildFromParts(d.name,d.recipe,{kind:'custom',listed:true,intro:d.intro,effects:d.effects,cupType:d.cupType});cup.id=d.id;cup.cupType=d.cupType;var item={id:d.id,name:d.name,nameEn:d.name.toUpperCase(),description:d.intro,effects:d.effects||null,glass:uiGlass(d.cupType),color:colorHex(d.color),category:'custom',registered:false,engineCup:cup},at=state.drinks.findIndex(function(x){return x.id===d.id;});if(at>=0)state.drinks[at]=item;else state.drinks.push(item);if(state.visibility[d.id]===undefined)state.visibility[d.id]=true;});persist();render();}).catch(function(){});
  setInterval(function(){if(state.screen==='history')syncHistory().then(render);},5000);
  render();
})();
</script>
