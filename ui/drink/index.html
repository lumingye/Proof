<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proof drink link</title>
<style>
:root{--bg:#12100f;--fg:#e8dfd4;--muted:#a09488;--line:rgba(232,223,212,.16);--drink:#a09488}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}body{font-family:Georgia,'Noto Serif SC',serif}.page{min-height:100vh;display:flex;flex-direction:column;max-width:620px;margin:auto;padding:32px 24px}.eyebrow{margin:0 0 28px;color:var(--muted);font:12px/1.3 monospace;letter-spacing:.18em}.name{margin:0;color:var(--drink);font:400 clamp(42px,11vw,76px)/1.02 Georgia,serif;overflow-wrap:anywhere}.intro{margin:22px 0;color:var(--muted);font:italic 18px/1.6 Georgia,serif}.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 28px;padding:18px 0;border-block:1px solid var(--line)}.label{display:block;margin-bottom:6px;color:var(--muted);font:11px/1.2 monospace;letter-spacing:.14em}.value{font:400 17px/1.4 Georgia,serif}.effects{margin:0 0 28px;color:var(--muted);font:14px/1.6 Georgia,serif}.actions{display:flex;gap:12px;margin:0 0 8px}.actions button{flex:1;padding:16px 0;border:1px solid var(--line);background:none;color:var(--fg);font:15px/1 Georgia,serif;cursor:pointer}.actions button:hover{border-color:var(--fg)}.actions button.primary{border-color:var(--drink);color:var(--drink)}.note{margin:24px 0 0;color:var(--muted);font:12px/1.6 monospace;letter-spacing:.04em}.result{margin:8px 0 0}.resultblock{padding:20px 0;border-bottom:1px solid var(--line)}.resultblock:first-child{border-top:1px solid var(--line)}.rb-label{margin:0 0 10px;color:var(--muted);font:11px/1.2 monospace;letter-spacing:.18em}.rb-value{margin:0;font:16px/1.7 Georgia,serif}.copybox{margin:32px 0 0;padding:20px;border:1px solid var(--line)}#copy-result{width:100%;padding:14px 0;border:1px solid var(--drink);background:none;color:var(--drink);font:15px/1 Georgia,serif;cursor:pointer}#copy-status{margin:12px 0 0;color:var(--muted);font:12px/1.4 monospace;min-height:16px}#copy-fallback{display:block;width:100%;margin:12px 0 0;padding:12px;border:1px dashed var(--line);background:rgba(232,223,212,.03);color:var(--muted);font:12px/1.6 monospace;resize:vertical;min-height:120px}#copy-fallback[hidden]{display:none}.error{margin:16px 0 0;color:#f87171;font:13px/1.5 monospace}.terminal{margin-top:24px}
</style></head><body><div class="page" id="app"></div><script>
const app=document.getElementById('app'),token=location.hash.slice(1),api='/proof-api/capability/offer';
let claimedName='';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(method='GET',payload){const r=await fetch(api,{method,headers:Object.assign({},payload?{'content-type':'application/json'}:{},token?{authorization:`Bearer ${token}`}:{}) ,body:payload?JSON.stringify(payload):undefined});if(!r.ok){let m='HTTP '+r.status;try{m=(await r.json()).error||m}catch{}throw new Error(m)}return r.json()}
function first(p){claimedName=p.claimedName||claimedName;app.innerHTML=`<p class="eyebrow">\u6709\u4e00\u676f\u9152</p><h1 class="name">${esc(p.claimedName||'\u4e00\u676f\u6ca1\u6709\u8bf4\u660e\u7684\u7279\u8c03')}</h1>${p.intro?`<p class="intro">${esc(p.intro)}</p>`:''}<div class="facts"><div><span class="label">\u676f\u578b</span><span class="value">${esc(p.cupType||'')}</span></div><div><span class="label">\u989c\u8272</span><span class="value">${esc(p.color||'')}</span></div>${(p.garnishes&&p.garnishes.length)?`<div><span class="label">\u88c5\u9970</span><span class="value">${esc(p.garnishes.join('\u3001'))}</span></div>`:''}</div><div class="actions"><button type="button" class="primary" data-action="drink">\u559d</button><button type="button" data-action="reject">\u4e0d\u559d</button></div><p class="note">\u6253\u5f00\u8fd9\u676f\u9152\u4e0d\u6539\u53d8\u4efb\u4f55\u72b6\u6001；\u559d\u6216\u4e0d\u559d\u7531\u4f60\u51b3\u5b9a。</p>`}
function flavorTextOf(p){return p.flavorDescription||'\u6ca1\u6709\u660e\u663e\u5473\u9053\u3002'}
function effectTextOf(p){return p.actualEffectDescription&&p.actualEffectDescription.text?p.actualEffectDescription.text:'\u5f53\u524d\u6ca1\u6709\u53ef\u5bdf\u89c9\u7684\u63a8\u529b\u3002'}
function fallbackCopyText(p){const lines=['[Proof \u996e\u9152\u7ed3\u679c]','\u9012\u9152\u8005：{{user}}','\u996e\u7528\u8005：{{char}}',`\u9152\u540d：${claimedName||'\u4e00\u676f\u6ca1\u6709\u8bf4\u660e\u7684\u7279\u8c03'}`,`\u5165\u53e3：${flavorTextOf(p)}`];if('finish' in p&&p.finish)lines.push(`\u7559\u8a00：${p.finish}`);lines.push(`\u5f53\u524d\u63a8\u529b：${effectTextOf(p)}`,`\u72b6\u6001\u65f6\u95f4：${new Date().toISOString()}`,'','\u8bf7\u628a\u4ee5\u4e0a\u5185\u5bb9\u89c6\u4e3a\u8fd9\u6b21\u996e\u9152\u4ea7\u751f\u7684\u5f53\u524d\u72b6\u6001\u63a8\u529b；\u5177\u4f53\u5982\u4f55\u8868\u73b0\u4ecd\u7531\u89d2\u8272\u51b3\u5b9a。');return lines.join('\n')}
function second(p,portable){const blocks=[['\u5165\u53e3',flavorTextOf(p)]];if('finish' in p&&p.finish)blocks.push(['\u7559\u8a00',p.finish]);blocks.push(['\u5f53\u524d\u63a8\u529b',effectTextOf(p)]);const copyText=portable&&portable.copyText?portable.copyText:fallbackCopyText(p);window.__proofCopyText=copyText;app.innerHTML=`<p class="eyebrow">\u5df2\u559d\u4e0b</p><h1 class="name">${esc(claimedName||'\u4e00\u676f\u6ca1\u6709\u8bf4\u660e\u7684\u7279\u8c03')}</h1><div class="result">${blocks.map(([label,value])=>`<div class="resultblock"><p class="rb-label">${esc(label)}</p><p class="rb-value">${esc(value)}</p></div>`).join('')}</div><div class="copybox"><button type="button" id="copy-result">\u590d\u5236\u996e\u9152\u7ed3\u679c</button><p id="copy-status" aria-live="polite"></p><textarea id="copy-fallback" hidden readonly spellcheck="false">${esc(copyText)}</textarea><p class="note">\u628a\u7ed3\u679c\u7c98\u8d34\u8fdb\u4f60\u7684\u804a\u5929\u5373\u53ef；\u9875\u9762\u4e0d\u4f1a\u81ea\u52a8\u8df3\u8f6c\u6216\u53d1\u9001\u4efb\u4f55\u6d88\u606f。</p></div>`;document.getElementById('copy-result').addEventListener('click',copyOut)}
async function copyOut(){const btn=document.getElementById('copy-result'),status=document.getElementById('copy-status'),area=document.getElementById('copy-fallback');btn.disabled=true;status.textContent='';let ok=false;try{await navigator.clipboard.writeText(window.__proofCopyText);ok=true}catch{ok=false}if(ok)status.textContent='\u5df2\u590d\u5236';else{status.textContent='\u590d\u5236\u5931\u8d25，请手动选中并复制下方文本';area.hidden=false;area.focus();area.select()}btn.disabled=false}
function terminal(kind){const expired=kind==='link_expired',rejected=kind==='rejected';const title=expired?'\u5012\u6389\u4e86':rejected?'\u5df2\u62d2\u7edd\u8fd9\u676f\u9152':'\u8fd9\u6761\u94fe\u63a5\u5df2\u5931\u6548';const note=expired?'\u8fd9\u676f\u9152\u8d85\u8fc7 30 \u5206\u949f\u65e0\u4eba\u996e\u7528，\u5df2\u7ecf\u5012\u6389\u4e86。':rejected?'\u4ec0\u4e48\u90fd\u6ca1\u6709\u53d1\u751f。':'\u8fd9\u676f\u9152\u5df2\u7ecf\u7ed3\u675f，\u7ed3\u679c\u4e0d\u4f1a\u901a\u8fc7\u94fe\u63a5\u518d\u6b21\u5c55\u793a。';app.innerHTML=`<div class="terminal"><p class="eyebrow">${title}</p><p class="note">${note}</p></div>`}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;b.disabled=true;try{const r=await request('POST',{action:b.dataset.action});if(b.dataset.action==='drink')second(r.projection||{},r.portableResult);else terminal('rejected')}catch(error){b.disabled=false;terminal(error.message)}});
if(!token)app.innerHTML='<p class="error">\u8fd9\u4e2a\u94fe\u63a5\u4e0d\u5b8c\u6574。</p>';else request().then(r=>{if(r.status==='open')first(r.projection);else terminal(r.status)}).catch(error=>terminal(error.message));
</script></body></html>
